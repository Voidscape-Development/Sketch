<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0c0d0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json{{q}}">
<link rel="icon" href="icon.svg">
<title>Sketch Remote</title>
<style>
:root{color-scheme:dark;--bg:#0c0d0f;--fg:#ededed;--muted:#8a8d93;--bar:#17181b}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif;user-select:none;-webkit-user-select:none;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;color:#6e7178}
header div{display:flex;align-items:center;gap:12px}
header button{border:0;border-radius:8px;background:var(--bar);color:var(--fg);font:inherit;padding:3px 8px}
#st{display:flex;align-items:center;gap:6px}
#st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dot,#ff5a5f)}
main{flex:1;min-height:0;display:grid;place-items:center;padding:0 12px;overflow:hidden}
#wrap{position:relative;width:100%;max-height:100%;aspect-ratio:16/9;background:#1a1b1f;border-radius:6px;overflow:hidden;touch-action:none;transform-origin:0 0}
#wrap img,#wrap canvas{position:absolute;inset:0;width:100%;height:100%}
footer{padding:12px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-width:640px;width:100%;margin:0 auto}
.row{display:flex;justify-content:center;gap:14px}
.sw{width:28px;height:28px;border-radius:50%;border:0;padding:0;box-shadow:0 0 0 3px var(--bg),0 0 0 4px transparent}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--fg)}
#custom{position:relative;display:block;background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red)}
#custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0}
#presets{display:flex;gap:8px;overflow-x:auto}
#presets button{flex:0 0 auto;border:0;border-radius:14px;padding:6px 12px 6px 9px;background:var(--bar);color:var(--fg);font:inherit;display:flex;align-items:center;gap:7px}
#presets i{width:10px;height:10px;border-radius:50%}
.bar{display:flex;background:var(--bar);border-radius:16px;padding:4px;overflow-x:auto}
.bar button{width:44px;height:44px;flex:0 0 auto;border:0;border-radius:12px;background:none;color:var(--muted);display:grid;place-items:center}
.bar button.on{background:var(--fg);color:#111214}
#opts{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;background:var(--bar);border-radius:16px;padding:12px 14px}
#opts select{justify-self:start;background:var(--bg);color:var(--fg);border:1px solid #2a2c31;border-radius:8px;padding:6px 8px;font:inherit}
#opts input[type=checkbox]{justify-self:start;width:20px;height:20px;margin:0;accent-color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--fg)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<header><span>Sketch</span><div><button id="reset" hidden>1:1</button><span id="st">Connecting</span></div></header>
<main><div id="wrap"><img id="shot" alt=""><canvas id="cv"></canvas></div></main>
<footer id="foot">
  <div class="row" id="colors"></div>
  <div id="presets"></div>
  <input type="range" id="size" min="1" max="64" value="6" aria-label="Size">
  <div class="bar" id="tools"></div>
  <div id="opts" hidden>
    <label for="opacity">Opacity</label><input type="range" id="opacity" min="5" max="100" value="100">
    <label for="style">Style</label><select id="style"><option value="0">Solid</option><option value="1">Dashed</option><option value="2">Glow</option></select>
    <label for="stamp">Stamp</label><select id="stamp"></select>
    <label for="fill">Fill shapes</label><input type="checkbox" id="fill">
    <label for="ruler">Ruler</label><input type="checkbox" id="ruler">
  </div>
</footer>
<script>
const ACTIONS=[['undo','Undo','M9 14L4 9l5-5 M4 9h10a6 6 0 010 12h-3'],['redo','Redo','M15 14l5-5-5-5 M20 9H10a6 6 0 000 12h3'],
 ['clear','Clear my drawing','M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13'],['opts','Options','M4 7h10 M18 7h2 M4 17h2 M10 17h10 M16 5v4 M8 15v4']];
const COLORS=['#8ea6ff','#ededed','#ffb86b','#7cf2c8','#ff7ab6','#ff5a5f'];
const $=id=>document.getElementById(id), cv=$('cv'), ctx=cv.getContext('2d'), wrap=$('wrap');
let ws, kicked=false, tool=0, color=COLORS[0], size=6, drawing=null, last=null, frameW=1920, canDraw=false;
const send=m=>ws&&ws.readyState===1&&ws.send(JSON.stringify(m));
const icon=d=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
function button(parent,label,d,fn){const b=document.createElement('button');b.setAttribute('aria-label',label);b.title=label;b.innerHTML=icon(d);b.onclick=()=>fn(b);parent.append(b);return b}
function mark(sel,b){document.querySelectorAll(sel).forEach(x=>x.classList.toggle('on',x===b))}
function markTool(){document.querySelectorAll('#tools [data-tool]').forEach(b=>b.classList.toggle('on',+b.dataset.tool===tool))}
COLORS.forEach((c,i)=>{const b=document.createElement('button');b.className='sw'+(i?'':' on');b.style.background=b.dataset.c=c;b.setAttribute('aria-label','Color '+c);
 b.onclick=()=>{color=c;send({t:'color',v:c});mark('.sw',b)};$('colors').append(b)});
const custom=document.createElement('label');custom.className='sw';custom.id='custom';custom.title='Custom color';
custom.innerHTML='<input type="color" aria-label="Custom color">';$('colors').append(custom);
custom.firstChild.oninput=e=>{color=e.target.value;custom.style.background=color;send({t:'color',v:color});mark('.sw',custom)};
$('size').oninput=e=>{size=+e.target.value;send({t:'size',v:size})};
$('opacity').oninput=e=>send({t:'opacity',v:e.target.value/100});
for(const k of ['style','stamp'])$(k).onchange=e=>send({t:k,v:+e.target.value});
for(const k of ['fill','ruler'])$(k).onchange=e=>send({t:k,v:e.target.checked});
function sync(){send({t:'tool',v:tool});send({t:'color',v:color});send({t:'size',v:size});send({t:'opacity',v:$('opacity').value/100});
 for(const k of ['style','stamp'])send({t:k,v:+$(k).value});for(const k of ['fill','ruler'])send({t:k,v:$(k).checked})}
function init(m){ // tools, stamps and presets come from the plugin
  $('tools').innerHTML='';
  m.tools.forEach(([id,name,d])=>button($('tools'),name,d,()=>{tool=id;send({t:'tool',v:id});markTool()}).dataset.tool=id);
  ACTIONS.forEach(([t,name,d])=>button($('tools'),name,d,()=>t==='opts'?$('opts').hidden=!$('opts').hidden:(t!=='clear'||confirm('Clear your drawing?'))&&send({t})));
  const st=+$('stamp').value;$('stamp').innerHTML=m.stamps.map((s,i)=>`<option value="${i}">${s}</option>`).join('');$('stamp').value=st;
  $('presets').innerHTML='';$('presets').hidden=!m.presets.length;
  m.presets.forEach((p,i)=>{const b=document.createElement('button');b.innerHTML='<i></i>';b.firstChild.style.background=p.color;b.append(p.name);b.onclick=()=>send({t:'preset',v:i});$('presets').append(b)});
  markTool();sync();
}
function brush(m){ // a preset was applied: show its settings
  tool=m.tool;color=m.color;size=m.size;markTool();$('size').value=size;$('opacity').value=Math.round(m.opacity*100);
  $('style').value=m.style;$('stamp').value=m.stamp;$('fill').checked=m.fill;$('ruler').checked=m.ruler;
  const sw=[...document.querySelectorAll('.sw')].find(b=>b.dataset.c===color);mark('.sw',sw||custom);if(!sw)custom.style.background=color;
}
function status(text,dot){$('st').textContent=text;$('st').style.setProperty('--dot',dot)}
function state(m){canDraw=m.draw;$('foot').hidden=m.view;
  status(m.view?'View only':m.wait?'Waiting for host':m.draw?'Connected':'Locked by host',m.draw||m.view?'#7cf2c8':'#ffb86b')}
let name='';try{name=localStorage.getItem('sketchName')||''}catch{}
if(!name){name=(prompt('Your name (shown to the host)')||'').trim().slice(0,24);try{localStorage.setItem('sketchName',name)}catch{}}
function connect(){
  ws=new WebSocket(`ws://${location.host}/ws${location.search}`);ws.binaryType='blob';
  ws.onopen=()=>{status('Connected','#7cf2c8');send({t:'hello',v:name});send({t:'zoom',v:z})};
  ws.onclose=()=>{if(kicked)return status('Removed by host','#ff5a5f');status('Reconnecting','#ff5a5f');setTimeout(connect,1500)};
  ws.onmessage=e=>{
    if(typeof e.data==='string'){const m=JSON.parse(e.data);
      if(m.t==='size'){frameW=m.w;wrap.style.aspectRatio=m.w+'/'+m.h}else if(m.t==='init')init(m);else if(m.t==='brush')brush(m);else if(m.t==='state')state(m);else if(m.t==='kicked')kicked=true;return}
    const u=URL.createObjectURL(e.data);$('shot').onload=$('shot').onerror=()=>{URL.revokeObjectURL(u);if(drawing===null)ctx.clearRect(0,0,cv.width,cv.height);send({t:'ack'})};$('shot').src=u;
  };
}
function fit(){const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d}
new ResizeObserver(fit).observe(cv);
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,p:e.pointerType==='pen'?(e.pressure||.5):1}}
function echo(a,b){ // local preview of the stroke until the next live snapshot arrives
  ctx.strokeStyle=color;ctx.lineWidth=size*cv.width/frameW;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(a.x*cv.width,a.y*cv.height);ctx.lineTo(b.x*cv.width,b.y*cv.height);ctx.stroke();
}
// Two-finger pan and zoom
const touches=new Map();let z=1,tx=0,ty=0,g=null;
const mid=(a,b)=>({x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}),dist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1;
function view(){if(z<=1)z=1,tx=ty=0;wrap.style.transform=`translate(${tx}px,${ty}px) scale(${z})`;$('reset').hidden=z===1}
$('reset').onclick=()=>{z=1;view();send({t:'zoom',v:1})};
cv.onpointerdown=e=>{
  if(e.pointerType==='touch')touches.set(e.pointerId,e);
  if(touches.size===2){ // second finger: drop the stroke the first one started and pinch instead
    if(drawing!==null){drawing=null;send({t:'cancel'});ctx.clearRect(0,0,cv.width,cv.height)}
    const [a,b]=touches.values(),r=wrap.getBoundingClientRect();g={d:dist(a,b),m:mid(a,b),z,tx,ty,ox:r.left-tx,oy:r.top-ty};return}
  if(g||touches.size>2||!canDraw||drawing!==null)return;
  const p=pos(e);
  if(tool===8){const text=prompt('Text');if(text){send({t:'down',...p,text});send({t:'up',...p})}touches.delete(e.pointerId);return}
  cv.setPointerCapture(e.pointerId);drawing=e.pointerId;last=p;send({t:'down',...p});
};
cv.onpointermove=e=>{
  if(touches.has(e.pointerId))touches.set(e.pointerId,e);
  if(g){if(touches.size===2){const [a,b]=touches.values(),m=mid(a,b),nz=Math.min(4,Math.max(1,g.z*dist(a,b)/g.d)),k=nz/g.z;
    tx=m.x-g.ox-k*(g.m.x-g.ox-g.tx);ty=m.y-g.oy-k*(g.m.y-g.oy-g.ty);z=nz;view()}return}
  if(drawing!==e.pointerId)return;
  for(const ev of e.getCoalescedEvents?e.getCoalescedEvents():[e]){const p=pos(ev);if(tool<=1&&!$('ruler').checked)echo(last,p);last=p;send({t:'move',...p})}
};
cv.onpointerup=cv.onpointercancel=e=>{
  touches.delete(e.pointerId);
  if(g){if(!touches.size){g=null;send({t:'zoom',v:z})}return}
  if(drawing!==e.pointerId)return;drawing=null;send({t:'up',...pos(e)});
};
connect();
</script>
</body>
</html>
